name: ci

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: ecom_ai_test
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_USER: ecom_app
          MYSQL_PASSWORD: test-app-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: ecom_ai_ai_test
          POSTGRES_USER: ecom_ai
          POSTGRES_PASSWORD: test-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ecom_ai -d ecom_ai_ai_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.10.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ECOM_ENVIRONMENT: testing
      ECOM_DEBUG: "false"
      ECOM_READINESS_CHECKS_ENABLED: "false"
      ECOM_MYSQL_DSN: mysql+asyncmy://ecom_app:test-app-password@127.0.0.1:3306/ecom_ai_test?charset=utf8mb4
      ECOM_POSTGRES_DSN: postgresql+asyncpg://ecom_ai:test-postgres-password@127.0.0.1:5432/ecom_ai_ai_test
      ECOM_REDIS_URL: redis://127.0.0.1:6379/15
      ECOM_ACCESS_TOKEN_SECRET: ci-access-token-secret-not-for-production
      ECOM_SECURITY_HMAC_SECRET: ci-hmac-secret-not-for-production
      ECOM_FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ECOM_DEBUG_VERIFICATION_CODE: "000000"
      ECOM_RUN_INTEGRATION_TESTS: "1"
      ECOM_RUN_FILE_INTEGRATION_TESTS: "1"
      ECOM_OBJECT_STORAGE_ENABLED: "true"
      ECOM_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      ECOM_OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      ECOM_OBJECT_STORAGE_ACCESS_KEY: ci-minio-admin
      ECOM_OBJECT_STORAGE_SECRET_KEY: ci-minio-password-not-for-production
      ECOM_OBJECT_STORAGE_BUCKET_PREFIX: test-ci-
      ECOM_FILE_SCANNER_ENABLED: "true"
      ECOM_FILE_SCANNER_HOST: 127.0.0.1
      ECOM_FILE_SCANNER_PORT: "3310"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements/dev.txt
          python -m pip install --no-deps -e backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Start file security dependencies
        run: |
          docker run --detach --name ecom-minio-ci --publish 9000:9000 \
            --env MINIO_ROOT_USER="$ECOM_OBJECT_STORAGE_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$ECOM_OBJECT_STORAGE_SECRET_KEY" \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          docker run --detach --name ecom-clamav-ci --publish 3310:3310 \
            --health-cmd='printf health | clamdscan --stream - --no-summary >/dev/null 2>&1' \
            --health-interval=10s --health-timeout=10s --health-retries=30 \
            --health-start-period=90s \
            clamav/clamav-debian@sha256:2bb8cd7dfe3e87f86e969a2c415f7698583175e46dc2234672be9210c982c144
          timeout 180 bash -c 'until curl --fail --silent http://127.0.0.1:9000/minio/health/live; do sleep 2; done'
          timeout 240 bash -c 'until [[ "$(docker inspect --format={{.State.Health.Status}} ecom-clamav-ci)" == healthy ]]; do sleep 3; done'
      - name: Install browser acceptance runtime
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Apply database migrations and seed references
        run: |
          cd backend
          python -m alembic -c alembic.mysql.ini upgrade head
          # k05 is the reviewed rollback floor: crossing it would recreate
          # retired plaintext internal-note storage and is intentionally blocked.
          python -m alembic -c alembic.mysql.ini downgrade k05f6a8b9c0d
          python -m alembic -c alembic.mysql.ini upgrade head
          python -m alembic -c alembic.postgres.ini upgrade head
          python -m alembic -c alembic.postgres.ini downgrade base
          python -m alembic -c alembic.postgres.ini upgrade head
          python -m app.bootstrap.cli
      - name: Verify generated registries and API contract
        run: |
          python scripts/generate_permission_catalog.py
          make trace-catalog
          make openapi
          make registry-check
          make acceptance-gate
          git diff --exit-code -- backend/app/generated/permission_catalog.py backend/app/generated/operation_trace_catalog.py docs/openapi-v1.json frontend/src/api/generated/schema.ts
      - name: Run quality gates
        run: make lint acceptance-test
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.sha }}
          path: artifacts/acceptance/current
          if-no-files-found: error
          retention-days: 14
