name: release-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            context: backend
            image: ghcr.io/${{ github.repository_owner }}/ecom-ai-api
          - component: frontend
            context: frontend
            image: ghcr.io/${{ github.repository_owner }}/ecom-ai-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push immutable release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan published digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign and verify published digest
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
