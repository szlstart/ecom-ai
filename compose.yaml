name: ecom-ai

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecom_ai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
      MYSQL_USER: ${MYSQL_APP_USER:-ecom_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-local-app-change-me}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecom_ai_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ecom_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-change-me}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${ECOM_OBJECT_STORAGE_ACCESS_KEY:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${ECOM_OBJECT_STORAGE_SECRET_KEY:-local-minio-change-me}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [backend]

  clamav:
    image: clamav/clamav-debian@sha256:2bb8cd7dfe3e87f86e969a2c415f7698583175e46dc2234672be9210c982c144
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_HOST_PORT:-13310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf health | clamdscan --stream - --no-summary >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    networks: [backend]

  api:
    profiles: [app]
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_API_HOST: 0.0.0.0
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
      ECOM_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ecom_ai}:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/${POSTGRES_DB:-ecom_ai_ai}
      ECOM_REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-change-me}@redis:6379/0
      ECOM_OBJECT_STORAGE_ENABLED: "true"
      ECOM_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ECOM_OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT:-19000}
      ECOM_OBJECT_STORAGE_ACCESS_KEY: ${ECOM_OBJECT_STORAGE_ACCESS_KEY:-local-minio-admin}
      ECOM_OBJECT_STORAGE_SECRET_KEY: ${ECOM_OBJECT_STORAGE_SECRET_KEY:-local-minio-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  file-worker:
    profiles: [app]
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
      ECOM_OBJECT_STORAGE_ENABLED: "true"
      ECOM_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ECOM_OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT:-19000}
      ECOM_OBJECT_STORAGE_ACCESS_KEY: ${ECOM_OBJECT_STORAGE_ACCESS_KEY:-local-minio-admin}
      ECOM_OBJECT_STORAGE_SECRET_KEY: ${ECOM_OBJECT_STORAGE_SECRET_KEY:-local-minio-change-me}
      ECOM_FILE_SCANNER_ENABLED: "true"
      ECOM_FILE_SCANNER_HOST: clamav
      ECOM_FILE_SCANNER_PORT: "3310"
    command: ["python", "-m", "app.workers.file_processor"]
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_healthy}
      clamav: {condition: service_healthy}
    networks: [backend]

  batch-worker:
    profiles: [app]
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
      ECOM_OBJECT_STORAGE_ENABLED: "true"
      ECOM_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ECOM_OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT:-19000}
      ECOM_OBJECT_STORAGE_ACCESS_KEY: ${ECOM_OBJECT_STORAGE_ACCESS_KEY:-local-minio-admin}
      ECOM_OBJECT_STORAGE_SECRET_KEY: ${ECOM_OBJECT_STORAGE_SECRET_KEY:-local-minio-change-me}
    command: ["python", "-m", "app.workers.batch_job_processor"]
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_healthy}
      file-worker: {condition: service_started}
    networks: [backend]

  order-timeout-worker:
    profiles: [app]
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
    command: ["python", "-m", "app.workers.order_timeout_closer"]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [backend]

  payment-reconcile-worker:
    profiles: [app]
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
    command: ["python", "-m", "app.workers.payment_reconciler"]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [backend]

  logistics-sync-worker:
    profiles: [app]
    restart: unless-stopped
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      ECOM_MYSQL_DSN: mysql+asyncmy://${MYSQL_APP_USER:-ecom_app}:${MYSQL_APP_PASSWORD:-local-app-change-me}@mysql:3306/${MYSQL_DATABASE:-ecom_ai}?charset=utf8mb4
    command: ["python", "-m", "app.workers.logistics_synchronizer"]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [backend]

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  backend:
    driver: bridge
