non_resource_identifiers:
  request_id:
    prefix: req_
    pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
    client_generated: false
  idempotency_key:
    format: opaque
    client_generated: true
  cursor:
    format: signed_opaque
    client_generated: false
  approval_token:
    format: signed_opaque
    client_generated: false
  upload_ticket:
    format: signed_opaque
    client_generated: false
  configuration_version:
    format: registered_semantic_version
    examples: [regcfg_2026_08_01, username_v1, password_v3]
  legal_document_version:
    format: registered_semantic_version
    examples: [terms_2026_08, privacy_2026_08]
