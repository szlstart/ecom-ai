version: 1
status: normative
route_parameter_style: camelCase
api_parameter_style: snake_case
api_base_path: /api/v1
operation_contract:
  openapi_required_extensions:
    - x-requirement-id
    - x-owner-kind
    - x-permission-codes
    - x-scope-policy
    - x-domain-command
    - x-audit-event
    - x-idempotency-policy
    - x-test-case-ids
  owner_kinds: [vue_route, global_ui, internal_only, webhook, worker]
  owner_resolution:
    vue_route: operation appears in exactly one route entry or declares shared_routes
    global_ui: operation declares the named app shell, interceptor, uploader or realtime client
    internal_only: operation is unreachable from the public gateway
    webhook: operation is authenticated by the registered provider contract
    worker: operation is invoked only by a registered event or scheduled job
  orphan_policy: fail_ci
  note: >-
    Route-level operation lists are a readable projection. Before code generation,
    each button or automatic behavior is expanded to one OpenAPI operation carrying
    the extensions above; an operation cannot inherit every permission in a route row.
idempotency_policy:
  allowed_values:
    - safe_read
    - idempotency_key_required
    - if_match_required_by_domain
    - idempotency_key_required+if_match_required_by_domain
    - provider_event_idempotency
    - http_method_idempotent
    - read_only_command
    - payload_client_message_id_deduplication
    - refresh_token_rotation_replay_detection
    - session_terminal_state_convergence
    - state_command_no_automatic_retry
    - resource_creation_no_automatic_retry
    - job_intent_no_automatic_retry
    - rate_limited_security_command_no_automatic_retry
    - short_lived_single_use_ticket
  default_method_policies:
    PUT: http_method_idempotent
    DELETE: http_method_idempotent
  operation_overrides:
    AiConsent_Pause: state_command_no_automatic_retry
    AiConsent_Resume: state_command_no_automatic_retry
    AiConsent_Revoke: state_command_no_automatic_retry
    PasswordResetHint_Get: read_only_command
    Auth_Login: rate_limited_security_command_no_automatic_retry
    AuthSession_Resume: read_only_command
    AdminAuthSession_Resume: read_only_command
    MerchantAuthSession_Resume: read_only_command
    AuthToken_Refresh: refresh_token_rotation_replay_detection
    Auth_Logout: session_terminal_state_convergence
    PasswordResetTicket_Create: rate_limited_security_command_no_automatic_retry
    AdminContent_Create: resource_creation_no_automatic_retry
    AdminContent_Publish: state_command_no_automatic_retry
    AdminContent_Withdraw: state_command_no_automatic_retry
    AdminAiEvaluation_Run: job_intent_no_automatic_retry
    AdminDeadLetter_Preview: read_only_command
    RefundEligibility_Check: read_only_command
    Message_CreateMine: payload_client_message_id_deduplication
    ResolutionCheckResponse_CreateMine: payload_client_message_id_deduplication
    MerchantExclusiveMessage_CreateMine: payload_client_message_id_deduplication
    AdminAiMessage_CreateMine: payload_client_message_id_deduplication
    SupportConversationMessage_Send: payload_client_message_id_deduplication
    SupportMessage_Send: payload_client_message_id_deduplication
    RealtimeTicket_CreateMine: short_lived_single_use_ticket
    SupportRealtimeTicket_Create: short_lived_single_use_ticket
    AdminKnowledgeDocument_Create: resource_creation_no_automatic_retry
    AdminKnowledgeIndex_Cancel: state_command_no_automatic_retry
    AdminKnowledge_Search: read_only_command
    AdminAgentVersion_Create: resource_creation_no_automatic_retry
    AdminAgentSkillBinding_Create: resource_creation_no_automatic_retry
    AdminAiKillSwitch_Activate: state_command_no_automatic_retry
    AdminAiKillSwitch_Deactivate: state_command_no_automatic_retry
    AdminSkill_Create: resource_creation_no_automatic_retry
    AdminSkill_VersionCreate: resource_creation_no_automatic_retry
    AdminSkillToolBinding_Create: resource_creation_no_automatic_retry
    AdminTool_Create: resource_creation_no_automatic_retry
    AdminTool_VersionCreate: resource_creation_no_automatic_retry
    AdminAuthToken_Refresh: refresh_token_rotation_replay_detection
    AdminAuth_Logout: session_terminal_state_convergence
    MerchantAuth_Login: rate_limited_security_command_no_automatic_retry
    MerchantAuth_Register: resource_creation_no_automatic_retry
    MerchantAuth_Reauthenticate: rate_limited_security_command_no_automatic_retry
    MerchantAuthToken_Refresh: refresh_token_rotation_replay_detection
    MerchantAuth_Logout: session_terminal_state_convergence
    AdminAuth_PasswordLogin: rate_limited_security_command_no_automatic_retry
    AdminAuth_PasswordReauthenticate: rate_limited_security_command_no_automatic_retry
  semantics: >-
    Header-backed policies are preferred for retryable business commands. PUT and DELETE use
    their resource-convergence semantics and still apply domain guards. Payload-deduplicated
    messages use client_message_id. Refresh and webhook operations use protocol replay guards.
    A no_automatic_retry policy is an explicit exception: clients must reconcile by a list/detail
    query after an unknown outcome and must never retry automatically; adding a new exceptional
    POST requires an operation-level entry here and review. The value none is forbidden.
required_fields:
  - requirement_id
  - route
  - component
  - audience
  - layout
  - auth
  - operations
  - authorization
  - domain_rules
  - tests
scope_resolution:
  description: >-
    Every route has one deterministic effective scope. Public routes resolve to
    none; user routes resolve from the authenticated subject plus the ownership
    expression; admin and merchant routes resolve from the Permission Registry
    scope types, the authenticated operator grants and the route resource. Client
    parameters can narrow but never widen this scope.
  public: none
  user: authenticated_subject_intersect_authorization
  admin: permission_scope_intersect_admin_grants_intersect_route_resource
  merchant: permission_scope_intersect_store_operator_grants_intersect_route_resource
  store_resource_rule: server_derived_store_scope
  queue_resource_rule: server_derived_queue_scope
  platform_resource_rule: platform_scope_only
global_components:
  - requirement_id: GLOBAL-FILE-UPLOAD-01
    component: FileUploader.vue
    owner_kind: global_ui
    shared_routes:
      - /admin/stores/:storeId
      - /admin/products/:productId
      - /admin/categories
      - /admin/brands
      - /merchant/products/:productId
      - /merchant/store
    auth: required_for_upload_optional_for_public_read
    operations: [FileUploadPolicy_Get, FileUploadSession_Create, FileUploadSession_Get, FileUploadSession_Complete, FileUploadSession_Abort, File_GetMetadata, File_Get]
    authorization: purpose_owner_status_and_scope
    domain_rules: [presigned_temporary_key, immutable_source_copy, malware_scan, safe_derivative_only]
    tests: [FILE-UPLOAD-*]
